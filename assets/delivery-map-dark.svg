<title>AI delivery map</title>
<desc>Data, models, retrieval and applications.</desc>
<defs></defs>
<style>text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;}</style>
<rect x="0.5" y="0.5" width="406" height="187" rx="14" fill="#161b22" stroke="#30363d"/><text x="24" y="36" font-size="15" font-weight="600" fill="#f0f6fc">AI delivery map</text><text x="24" y="57" font-size="11.5" fill="#8b949e">From data to an application people can use</text><line x1="50" y1="106" x2="357" y2="106" stroke="#21262d" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="106" r="11" fill="#161b22" stroke="#58a6ff" stroke-width="3"/><text x="50" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#f0f6fc">Data</text><text x="50" y="158" text-anchor="middle" font-size="11.5" fill="#c9d1d9">Pandas</text><circle cx="150" cy="106" r="11" fill="#161b22" stroke="#d2a8ff" stroke-width="3"/><text x="150" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#f0f6fc">Models</text><text x="150" y="158" text-anchor="middle" font-size="11.5" fill="#c9d1d9">PyTorch</text><circle cx="255" cy="106" r="11" fill="#161b22" stroke="#3fb950" stroke-width="3"/><text x="255" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#f0f6fc">Retrieval</text><text x="255" y="158" text-anchor="middle" font-size="11.5" fill="#c9d1d9">Pinecone</text><circle cx="357" cy="106" r="11" fill="#161b22" stroke="#3fb950" stroke-width="3"/><text x="357" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#f0f6fc">Apps</text><text x="357" y="158" text-anchor="middle" font-size="11.5" fill="#c9d1d9">Django</text>
